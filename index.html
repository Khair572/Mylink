<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E5C52">
<title>DQH AL-IDRISY</title>
<style>
  :root{
    --bg:#0E5C52; --text:#F2FAF8; --sub:#B9DDD6;
    --card:#FFFFFF; --card-text:#12332E; --card-sub:#51726C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:calc(40px + env(safe-area-inset-top,0px)) 20px calc(32px + env(safe-area-inset-bottom,0px))}
  .wrap{width:100%;max-width:440px;text-align:center}
  h1{font-size:1.35rem;font-weight:700;margin-bottom:6px}
  .sub{color:var(--sub);font-size:.92rem;margin-bottom:28px}
  .link{display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;background:var(--card);color:var(--card-text);border-radius:16px;padding:14px 16px;margin-bottom:12px;border-left:6px solid var(--c)}
  .link:hover{transform:translateY(-1px)}
  .link:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .ico{flex:none;width:44px;height:44px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:1.3rem}
  .t{font-weight:650;font-size:1rem}
  .d{font-size:.82rem;color:var(--card-sub);margin-top:2px}
  footer{margin-top:24px;font-size:.78rem;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <h1>دار القران والحديث الادرسي</h1>
  <p class="sub">Pilih layanan</p>

  <a class="link" style="--c:#0E8A7A" href="https://dbulanan572.vercel.app/index.html" target="_blank" rel="noopener">
    <span class="ico" aria-hidden="true">📊</span>
    <span><span class="t">Data Bulanan Santri</span><br><span class="d">Status pembayaran bulanan</span></span>
  </a>

  <a class="link" style="--c:#2547C7" href="https://tabansa572.vercel.app/" target="_blank" rel="noopener">
    <span class="ico" aria-hidden="true">💳</span>
    <span><span class="t">TABANSA</span><br><span class="d">Tabungan santri</span></span>
  </a>

  <a class="link" style="--c:#4F46E5" href="https://dbsantri572.vercel.app/index.html" target="_blank" rel="noopener">
    <span class="ico" aria-hidden="true">📚</span>
    <span><span class="t">Santri Pulang / Kabur</span><br><span class="d">Data izin, kabur, dan hitung denda</span></span>
  </a>

  <footer>Apa bila ada kendala langsung DM aja</footer>
</div>
</body>
</html>
